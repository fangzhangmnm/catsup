<!DOCTYPE html>
<!-- created by Claude Fable 5, 2026-09-01 —— 2D 肥皂膜 lab（drill 仪器；3D 观察窗在 ../playground/） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CatsUp lab — 2D 肥皂膜</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f2ec; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #boardWrap { flex: 1; min-width: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #side { width: 280px; flex: 0 0 280px; border-left: 1px solid #ccc; background: #fff; display: flex; flex-direction: column; }
  #tools, #presets { padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #eee; }
  #tools button, #presets button { flex: 1 0 30%; padding: 6px 0; border: 1px solid #bbb; border-radius: 6px; background: #fafafa; font-size: 13px; }
  #tools button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  #presets button { background: #f3efe4; }
  #presetsLabel { flex: 1 0 100%; font-size: 11px; color: #999; }
  #hint { padding: 4px 8px; font-size: 11px; color: #999; border-bottom: 1px solid #eee; }
  #logBar { display: flex; align-items: center; padding: 4px 8px; border-bottom: 1px solid #eee; }
  #logBar span { flex: 1; font-size: 11px; color: #999; }
  #logBar button { font-size: 11px; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; padding: 2px 8px; }
  #log { flex: 1; overflow-y: auto; padding: 8px; font-size: 12px; line-height: 1.7; color: #333; }
  #log .ev { border-bottom: 1px dashed #eee; }
  #log .sep { color: #999; font-size: 11px; padding-top: 6px; }
  #tip { display: none; position: fixed; z-index: 10; padding: 2px 6px; font-size: 12px;
         background: #ffffffee; border: 1px solid #888; border-radius: 4px; pointer-events: none; }
  #marquee { display: none; position: fixed; z-index: 9; border: 1px dashed #666;
             background: #2b6cb011; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="side">
    <div id="tools">
      <button id="toolSelect" title="Space">选择</button>
      <button id="toolLine" title="L">画线</button>
      <button id="toolRect" title="R">矩形</button>
      <button id="toolMove" title="M">移动</button>
      <button id="toolPP" title="P">推拉</button>
      <button id="toolErase" title="E">橡皮</button>
      <button id="toolEraseFace">删面</button>
      <button id="clearAll">清空</button>
      <button id="undoBtn">撤销</button>
      <button id="redoBtn">重做</button>
    </div>
    <div id="presets"><span id="presetsLabel">场景预置（一键摆好，事件照常涌出）</span></div>
    <div id="hint">快捷键 Space/L/R/M/P/E；右/中键拖=环绕 Shift=平移 滚轮=缩放；画线/矩形/移动/推拉可点两下；Ctrl+Z/Y 撤销重做；Delete 删除；Esc 取消</div>
    <div id="logBar"><span>膜事件日志（新的在上）</span><button id="clearLog">清日志</button></div>
    <div id="log"></div>
  </div>
</div>
<div id="tip"></div>
<div id="marquee"></div>
<!-- esbuild 把 main.ts bundle 成 bundle.js（npm run build） -->
<script src="./bundle.js"></script>
</body>
</html>
