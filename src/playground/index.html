<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CatsUp playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f5f2ec; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #board { flex: 1; touch-action: none; cursor: crosshair; }
  #side { width: 240px; border-left: 1px solid #ccc; background: #fff; display: flex; flex-direction: column; }
  #tools { padding: 8px; display: flex; gap: 6px; border-bottom: 1px solid #eee; }
  #tools button { flex: 1; padding: 6px 0; border: 1px solid #bbb; border-radius: 6px; background: #fafafa; font-size: 14px; }
  #tools button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  #log { flex: 1; overflow-y: auto; padding: 8px; font-size: 12px; line-height: 1.7; color: #333; }
  #log .ev { border-bottom: 1px dashed #eee; }
</style>
</head>
<body>
<div id="app">
  <canvas id="board"></canvas>
  <div id="side">
    <div id="tools">
      <button id="toolLine">画线</button>
      <button id="toolErase">橡皮</button>
      <button id="toolEraseFace">删面</button>
    </div>
    <div id="log"></div>
  </div>
</div>
<!-- esbuild 把 main.ts bundle 成 bundle.js（npm run build） -->
<script src="./bundle.js"></script>
</body>
</html>
